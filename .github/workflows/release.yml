name: Release

on:
  push:
    tags:
      - "v*"

# Read-only token by default; the release job widens it for itself.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
      id-token: write # mint the OIDC token Sigstore signs the provenance with
      attestations: write # store the provenance attestation
    # Scripts read the tag from the environment, never as expression text spliced into their source.
    env:
      REF_NAME: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "Controller Magic.slnx" --locked-mode

      - name: Test (Release)
        run: dotnet test "Controller Magic.slnx" -c Release

      - name: Publish self-contained single-file win-x64
        run: dotnet publish "Controller Magic/Controller Magic.csproj" -p:PublishProfile=win-x64

      - name: Package artifacts
        shell: pwsh
        run: |
          $publishDir = "Controller Magic/bin/Release/net10.0-windows/publish/win-x64"
          $zipPath = "ControllerMagic-$env:REF_NAME-win-x64.zip"
          $exePath = "ControllerMagic-$env:REF_NAME-win-x64.exe"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath
          # Space-free name: GitHub rewrites spaces in asset names, which would break SHA256SUMS.txt.
          Copy-Item -LiteralPath "$publishDir/Controller Magic.exe" -Destination $exePath
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV
          echo "EXE_PATH=$exePath" >> $env:GITHUB_ENV

      # Standard sha256sum format (hex, two spaces, name, LF) so `sha256sum -c` verifies the downloads.
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $lines = foreach ($file in $env:ZIP_PATH, $env:EXE_PATH) {
              "{0}  {1}`n" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant(), $file
          }
          Set-Content -Path SHA256SUMS.txt -Value (-join $lines) -NoNewline -Encoding utf8NoBOM

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.ZIP_PATH }}
            ${{ env.EXE_PATH }}

      # Pulls this tag's own section out of CHANGELOG.md (falling back to a plain note if the tag
      # has no matching "## [x.y.z]" entry) so the release notes are always the actual changelog,
      # not a re-typed summary that can drift from it.
      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = $env:REF_NAME -replace '^v', ''
          $content = Get-Content CHANGELOG.md -Raw
          $sections = $content -split '(?m)(?=^## \[)'
          $section = $sections | Where-Object { $_ -match "^## \[$([regex]::Escape($version))\]" } | Select-Object -First 1

          if ($section) {
              $notes = ($section -replace '^## \[[^\]]+\][^\r\n]*\r?\n', '').Trim()
              if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "No changelog details recorded for this release." }
          } else {
              $notes = "See CHANGELOG.md."
          }

          $notes | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.EXE_PATH }}
            SHA256SUMS.txt
          body_path: release-notes.md
          fail_on_unmatched_files: true
