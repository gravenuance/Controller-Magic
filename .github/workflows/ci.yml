name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only token by default; a job that needs more widens it for itself.
permissions:
  contents: read

jobs:
  build-and-test:
    # WinForms + Win32 P/Invokes (user32/winmm/dwmapi) - this only builds and runs on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "Controller Magic.slnx"

      # Release so TreatWarningsAsErrors (Directory.Build.props) and the full AnalysisLevel=
      # latest-all analyzer set actually fire - matching the local pre-push check exactly.
      - name: Build (Release)
        run: dotnet build "Controller Magic.slnx" -c Release --no-restore

      - name: Test (Release)
        run: dotnet test "Controller Magic.slnx" -c Release --no-build
