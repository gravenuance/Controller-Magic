name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    # WinForms + Win32 P/Invokes (user32/winmm/dwmapi) - this only builds and runs on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "Controller Magic.slnx"

      # Release so TreatWarningsAsErrors (Directory.Build.props) and the full AnalysisLevel=
      # latest-all analyzer set actually fire - matching the local pre-push check exactly.
      - name: Build (Release)
        run: dotnet build "Controller Magic.slnx" -c Release --no-restore

      - name: Test (Release)
        run: dotnet test "Controller Magic.slnx" -c Release --no-build
